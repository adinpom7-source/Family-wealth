name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe data.gov.il
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          BASE = "https://data.gov.il/api/3/action/"
          def call(action, **p):
              url = BASE + action + "?" + urllib.parse.urlencode(p)
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              return json.loads(urllib.request.urlopen(req, timeout=60).read().decode())
          out = {"packages": {}, "errors": []}
          for q in ("גמל", "פנסיה"):
              try:
                  r = call("package_search", q=q, rows=10)
                  out["search_" + q] = [[p["name"], p.get("title")] for p in r["result"]["results"]]
              except Exception as e:
                  out["errors"].append("search " + q + ": " + repr(e))
          for slug in ("gemelnet", "pensia-net", "pensianet"):
              try:
                  r = call("package_show", id=slug)["result"]
                  res = []
                  for x in r["resources"][:8]:
                      item = {"id": x["id"], "name": x.get("name"), "format": x.get("format"), "datastore": x.get("datastore_active")}
                      if x.get("datastore_active"):
                          try:
                              d = call("datastore_search", resource_id=x["id"], limit=3)["result"]
                              item["total"] = d.get("total")
                              item["fields"] = [f["id"] for f in d["fields"]]
                              item["sample"] = d["records"]
                          except Exception as e:
                              item["error"] = repr(e)
                      res.append(item)
                  out["packages"][slug] = {"title": r.get("title"), "resources": res}
              except Exception as e:
                  out["errors"].append(slug + ": " + repr(e))
          json.dump(out, open("probe.json", "w"), ensure_ascii=False, indent=1)
          PY
      - name: Save
        run: |
          git config user.name market-bot
          git config user.email market-bot@users.noreply.github.com
          git add probe.json
          git commit -m "probe result" || exit 0
          git push
