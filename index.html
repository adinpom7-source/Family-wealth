<style>
:root{--bg:#f3f5f7;--card:#fff;--text:#0f1b24;--muted:#6b7885;--line:#e5e9ed;--accent:#0f766e;--on:#fff;--bad:#c2410c;--sh:0 1px 2px #0000000a,0 6px 20px #0f1b240d}
:root[data-theme=dark]{--bg:#0b1115;--card:#141c23;--text:#eaf0f5;--muted:#8b9aa8;--line:#222d37;--accent:#2dd4bf;--on:#04201c;--bad:#fb923c;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#app{min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
header h1{font-size:20px;font-weight:700;margin:0}
main{flex:1;padding:6px 16px 100px;max-width:640px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--sh)}
.muted{color:var(--muted);font-size:14px}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.n{font-size:20px;font-weight:700}
h2{font-size:17px;font-weight:700;margin:0 0 12px}
label{font-size:14px;color:var(--muted)}
input,select{width:100%;padding:14px;margin:6px 0 10px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 16px;background:var(--accent);color:var(--on);font-weight:700;width:100%;margin-top:6px;transition:transform .1s}
button:active{transform:scale(.98)}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.icon{width:auto;padding:8px 12px;margin:0}
.err{color:var(--bad);font-size:14px;min-height:20px}
.wrap{max-width:420px;margin:0 auto;padding:28px 18px}
.row{display:flex;gap:12px}.row .card{flex:1}
.card[onclick]{cursor:pointer}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;color:var(--muted);margin:0;padding:8px 2px;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
nav button .i{font-size:21px}
nav button.on{color:var(--accent);font-weight:700}
.code{font:700 22px ui-monospace,monospace;letter-spacing:2px;direction:ltr;text-align:center;padding:10px;background:var(--bg);border-radius:12px}
.hero{background:linear-gradient(135deg,#0f766e,#0e9f8e);color:#fff;border-radius:24px;padding:22px;margin-bottom:12px;box-shadow:0 10px 30px #0f766e40}
:root[data-theme=dark] .hero{background:linear-gradient(135deg,#115e59,#0f766e);box-shadow:none}
.hero .lbl{opacity:.85;font-size:14px}.hero .sm{font-size:12px;opacity:.7;margin-top:10px}
.hbig{font-size:42px;font-weight:800;letter-spacing:-1px;line-height:1.15;margin:2px 0 10px}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;background:#ffffff26;font-weight:600;font-size:14px}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.seg button{width:auto;white-space:nowrap;margin:0;padding:8px 16px;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:14px}
.seg button.on{background:var(--accent);color:var(--on);border-color:transparent}
.donutw{display:flex;align-items:center;gap:18px}
.leg{flex:1;font-size:14px}.leg div{display:flex;align-items:center;gap:8px;margin:5px 0}.leg b{margin-inline-start:auto}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:20}
.sh{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.toast{position:fixed;bottom:92px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:30;font-weight:600}
/* theme v2: more color */
:root{--bg:#EEF2FF;--card:#fff;--text:#16203A;--muted:#66708C;--line:#E0E6F7;--accent:#0D9488;--bad:#E2531F;--sh:0 2px 4px #4f46e508,0 10px 28px #4f46e51a}
:root[data-theme=dark]{--bg:#1B2338;--card:#263250;--text:#EEF2FB;--muted:#9FACC9;--line:#364466;--accent:#5EEAD4;--bad:#FDA05A;--sh:0 8px 24px #0003}
body{background:linear-gradient(180deg,#D9E2FF 0,var(--bg) 340px) no-repeat var(--bg)}
:root[data-theme=dark] body{background:linear-gradient(180deg,#313C73 0,var(--bg) 340px) no-repeat var(--bg)}
.hero{background:linear-gradient(135deg,#4F46E5 0%,#0D9488 62%,#22C55E 100%);box-shadow:0 12px 32px #4f46e54d}
:root[data-theme=dark] .hero{background:linear-gradient(135deg,#4338CA 0%,#0F766E 100%);box-shadow:none}
button{background-image:linear-gradient(135deg,#4F46E5,#0D9488);color:#fff}
nav{backdrop-filter:blur(12px)}

<script>
const SB = supabase.createClient(
  "https://bshlkzsfabfosgatcfii.supabase.co",

const $ = s => document.querySelector(s);

const S = { tab: "home", m: null };

/* ---------- theme ---------- */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("theme", t); } catch (e) {}
}
(function () {
  let t = null;
  try { t = localStorage.getItem("theme"); } catch (e) {}
  setTheme(t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
})();
const toggleTheme = () => { setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); render(); };

/* ---------- boot ---------- */
async function boot() {
  const { data: { session } } = await SB.auth.getSession();
  if (!session) return authView();
  const { data, error } = await SB.from("household_members")
    .select("household_id,display_name,households(name,join_code)")
    .eq("user_id", session.user.id).maybeSingle();
  if (error) return fatal(error.message);
  if (!data) return onboardView();
  S.m = data; render();
}
function fatal(msg) {
  $("#app").innerHTML = `<div class="wrap"><div class="card"><h2>משהו השתבש</h2><div class="err">${esc(msg)}</div><button onclick="boot()">נסה שוב</button></div></div>`;
}

/* ---------- auth ---------- */
function authView(msg = "") {
  $("#app").innerHTML = `<div class="wrap">

      <label>אימייל</label><input id="em" type="email" autocomplete="email" dir="ltr">

      <div class="err" id="err">${esc(msg)}</div>
      <button onclick="doAuth('in')">כניסה</button>
      <button class="ghost" onclick="doAuth('up')">יצירת חשבון חדש</button>
    </div></div>`;
}
async function doAuth(mode) {
  const email = $("#em").value.trim(), password = $("#pw").value;
  if (!email || password.length < 8) return ($("#err").textContent = "יש להזין אימייל וסיסמה של 8 תווים לפחות");
  const { data, error } = mode === "in"
    ? await SB.auth.signInWithPassword({ email, password })
    : await SB.auth.signUp({ email, password });
  if (error) return ($("#err").textContent = error.message);
  if (!data.session) return ($("#err").textContent = "החשבון נוצר. אם נדרש אימות במייל, אשרו אותו ואז היכנסו.");
  boot();
}
const signOut = async () => { await SB.auth.signOut(); S.m = null; boot(); };

/* ---------- household onboarding ---------- */
function onboardView(msg = "") {
  $("#app").innerHTML = `<div class="wrap">
    <h1>ברוכים הבאים</h1><p class="muted">מי ראשון יוצר משפחה, והשני מצטרף עם קוד.</p>
    <div class="card"><h2>יצירת משפחה חדשה</h2>
      <label>השם שלך</label><input id="n1">
      <button onclick="createHH()">יצירה</button></div>
    <div class="card"><h2>הצטרפות עם קוד</h2>
      <label>השם שלך</label><input id="n2">
      <label>קוד הצטרפות</label><input id="cd" dir="ltr">
      <button class="ghost" onclick="joinHH()">הצטרפות</button></div>
    <div class="err" id="err">${esc(msg)}</div>
    <button class="ghost" onclick="signOut()">יציאה</button></div>`;
}
async function createHH() {
  const n = $("#n1").value.trim(); if (!n) return ($("#err").textContent = "יש להזין שם");
  const { error } = await SB.rpc("create_household", { p_name: "המשפחה", p_display: n });
  error ? ($("#err").textContent = error.message) : boot();
}
async function joinHH() {
  const n = $("#n2").value.trim(), c = $("#cd").value.trim();
  if (!n || !c) return ($("#err").textContent = "יש להזין שם וקוד");
  const { error } = await SB.rpc("join_household", { p_code: c, p_display: n });
  error ? ($("#err").textContent = "קוד לא תקין") : boot();
}

/* ---------- app shell ---------- */
const TABS = [["home","🏠","בית"],["inv","📈","השקעות"],["goals","🎯","מטרות"],["ins","🛡️","ביטוחים"],["tools","🧮","כלים"],["more","⚙️","עוד"]];
function render() {
  const dark = document.documentElement.dataset.theme === "dark";
  $("#app").innerHTML = `
    <header><h1>${esc(S.m.households.name)}</h1>
      <button class="ghost icon" onclick="toggleHide()" aria-label="הסתרת סכומים">${S.hide ? "🙈" : "👁"}</button><button class="ghost icon" onclick="toggleTheme()" aria-label="מצב כהה/בהיר">${dark ? "☀️" : "🌙"}</button></header>
    <main id="view"></main>
    <nav>${TABS.map(([k,i,l]) => `<button class="${S.tab===k?"on":""}" onclick="go('${k}')"><span class="i">${i}</span>${l}</button>`).join("")}</nav>`;
  views[S.tab]();
}
const go = t => { S.tab = t; S.sel = S.add = S.ed = null; S.gf = 0; S.insf = 0; S.insEd = null; render(); };
const fmt0 = n => new Intl.NumberFormat("he-IL", { style: "currency", currency: "ILS", maximumFractionDigits: 0 }).format(n || 0);
try { S.hide = localStorage.getItem("hide") === "1"; } catch (e) {}
const fmt = n => S.hide ? "₪ ••••" : fmt0(n);
const today = () => new Date().toISOString().slice(0, 10);
const V = h => ($("#view").innerHTML = h);
const opt = (a, k, l) => (a || []).map(x => `<option value="${esc(x[k])}">${esc(x[l])}</option>`).join("");

async function loadAll() {
  if (S.mk === undefined) await loadMk();
  const [i, t, v] = await Promise.all([
    SB.from("investments").select("*,institutions(name),asset_types(name)").eq("archived", false).order("created_at"),
    SB.from("transactions").select("investment_id,kind,amount,occurred_on"),
    SB.from("valuations").select("investment_id,value,as_of,created_at,source_label").order("as_of", { ascending: false }).order("created_at", { ascending: false })]);
  const err = i.error || t.error || v.error; if (err) throw err;
  const dep = {}, val = {};
  t.data.forEach(x => dep[x.investment_id] = (dep[x.investment_id] || 0) + (x.kind === "deposit" ? 1 : -1) * Number(x.amount));
  v.data.forEach(x => { if (!(x.investment_id in val)) val[x.investment_id] = x; });
  return i.data.map(r => {
    const d = dep[r.id] || 0, l = val[r.id], aft = l ? t.data.filter(z => z.investment_id === r.id && z.occurred_on > l.as_of).reduce((a, z) => a + (z.kind === "deposit" ? 1 : -1) * Number(z.amount), 0) : 0;
    let v = l ? Number(l.value) + aft : d, est = false;
    if (l && r.valuation_mode === "index" && S.mk) { const f = idxAt(l.as_of); if (f) { v = Number(l.value) * (S.mk[S.mk.length - 1][1] / f) + aft; est = true;
      const fr = (r.fee_pct || 0) / 100; if (r.fee_basis === "profit") { const gn = v - (Number(l.value) + aft); if (gn > 0) v -= gn * fr; } else v *= 1 - fr * (Date.now() - new Date(l.as_of)) / 31557600000; } }
    return { ...r, dep: d, val: v, est, asOf: l && l.as_of, srcLabel: l && l.source_label, hasVal: !!l };
  });
}

async function members() {
  if (!S.mem) { const r = await SB.from("household_members").select("user_id,display_name"); S.mem = r.data || []; }
  return S.mem;
}
function donut(items) {
  const T = items.reduce((a, x) => a + x.v, 0), C = ["#4F46E5","#0D9488","#F59E0B","#EC4899","#8B5CF6","#22C55E","#06B6D4","#F97316"];
  let off = 25;
  const segs = items.map((x, i) => { const p = x.v / T * 100, s = `<circle cx="21" cy="21" r="15.915" fill="none" stroke="${C[i % 8]}" stroke-width="6" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${off}"/>`; off -= p; return s; }).join("");
  return `<div class="donutw"><svg viewBox="0 0 42 42" width="130" height="130">${segs}</svg><div class="leg">${items.map((x, i) => `<div><i style="background:${C[i % 8]}"></i>${esc(x.n)}<b>${Math.round(x.v / T * 100)}%</b></div>`).join("")}</div></div>`;
}
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function sheet(title, label, cb, def, dd, withSrc, neg) {
  const d = document.createElement("div"); d.className = "ov";
  d.innerHTML = `<div class="sh"><h2>${esc(title)}</h2><label>${esc(label)}</label><input id="sv" inputmode="decimal" dir="ltr" placeholder="0"><label>תאריך</label><input id="sd" type="date" dir="ltr" value="${dd || today()}">${withSrc ? `<label>מקור הנתון</label><select id="ss"><option>דוח חודשי של בית ההשקעות</option><option>דוח רבעוני</option><option>דוח שנתי</option><option>אתר או אפליקציה של הגוף המנהל</option><option value="est">הערכה אישית</option></select>` : ""}<button id="ok">אישור</button><button class="ghost" id="no">ביטול</button></div>`;
  document.body.appendChild(d);
  const c = () => d.remove(); d.onclick = e => { if (e.target === d) c(); };
  $("#no").onclick = c;
  $("#ok").onclick = async () => { const a = parseFloat($("#sv").value.replace(/,/g, "")); if (isNaN(a) || (a < 0 && !neg)) return; const dt = $("#sd").value || today(), so = $("#ss") ? $("#ss").selectedOptions[0] : null, sv = so ? { l: so.text, e: so.value === "est" } : null; c(); await cb(a, dt, sv); };
  if (def !== undefined) $("#sv").value = def; $("#sv").focus();
}

const views = {
  async home() {
    V(`<div class="hero"><div class="lbl">טוען…</div><div class="hbig">&nbsp;</div></div>`);
    try {
      const [L0, mem] = await Promise.all([loadAll(), members()]);
      if (!$("#view")) return;
      const f = S.f || "all";
      const L = L0.filter(x => f === "all" || (f === "joint" ? !x.owner_user_id : x.owner_user_id === f));
      const K = L.filter(x => x.dep > 0), miss = L.filter(x => x.dep <= 0 && x.val > 0), v = L.reduce((a, x) => a + x.val, 0), d = K.reduce((a, x) => a + x.dep, 0), p = K.reduce((a, x) => a + x.val - x.dep, 0), pct = d > 0 ? p / d * 100 : 0;
      const g = {}; L.forEach(x => { const k = (x.asset_types && x.asset_types.name) || "ללא סוג"; g[k] = (g[k] || 0) + x.val; });
      const items = Object.entries(g).map(([n, v]) => ({ n, v })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
      const seg = [["all", "משפחה"], ...mem.map(m => [m.user_id, m.display_name]), ["joint", "משותף"]];
      V(`<div class="seg">${seg.map(([k, l]) => `<button class="${f === k ? "on" : ""}" onclick="S.f='${k}';render()">${esc(l)}</button>`).join("")}</div>
        <div class="hero"><div class="lbl">סך ההון</div><div class="hbig">${fmt(v)}</div>
          <div class="chip">${p >= 0 ? "▲" : "▼"} ${fmt(Math.abs(p))}${d > 0 ? ` · ${Math.abs(pct).toFixed(1)}%` : ""}</div>
          <div class="sm">לפי עדכוני שווי שהוזנו, לא שווי רשמי</div></div>
        <div class="row"><div class="card"><div class="muted">הפקדות נטו</div><div class="n">${fmt(d)}</div></div>
          <div class="card"><div class="muted">רווח / הפסד</div><div class="n" style="color:var(${p >= 0 ? "--accent" : "--bad"})">${fmt(p)}</div></div></div>
        ${items.length ? `<div class="card"><h2>חלוקה לפי סוג</h2>${donut(items)}</div>` : `<div class="card muted">עדיין אין השקעות. הוסיפו את הראשונה בלשונית "השקעות".</div>`}`);
      if (miss.length) $(".hero").insertAdjacentHTML("afterend", `<div class="card"><div class="muted">${miss.length} השקעות ללא סכום הפקדות, ולכן הרווח שלהן לא נכלל בחישוב. הקישו כדי להשלים:</div>${miss.slice(0, 6).map(x => `<div style="padding:10px 0;border-top:1px solid var(--line);cursor:pointer" onclick="S.tab='inv';S.sel='${x.id}';render()"><b>${esc(x.name)}</b></div>`).join("")}</div>`);
      if (L.length) { $("#view").insertAdjacentHTML("beforeend", '<div class="card" id="hist"><div class="muted">טוען גרף…</div></div>'); S.L2 = L; S.R = await rawData(); drawHist();
        const DY = { monthly: 35, quarterly: 100, yearly: 380 }, st = L.filter(x => { const c = x.report_cadence || "monthly"; return c !== "none" && (!x.hasVal || Date.now() - new Date(x.asOf) > DY[c] * 864e5); });
        if (st.length) $("#view").insertAdjacentHTML("beforeend", `<div class="card"><h2>דוחות לעדכון</h2>${st.slice(0, 6).map(x => `<div style="padding:10px 0;border-top:1px solid var(--line);cursor:pointer" onclick="S.tab='inv';S.sel='${x.id}';render()"><b>${esc(x.name)}</b> <span class="muted">· ${x.hasVal ? "עודכן " + esc(x.asOf) : "ללא עדכון"}</span></div>`).join("")}</div>`);
        const fee = L.reduce((a, x) => a + annFee(x), 0);
        if (fee > 0) $("#view").insertAdjacentHTML("beforeend", `<div class="card"><div class="muted">דמי ניהול שנתיים משוערים</div><div class="n">${fmt(fee)}</div></div>`);
        const tv = L.reduce((a, x) => a + x.val, 0);

function xirr(cf) {
  const t0 = cf[0].d, f = r => cf.reduce((s, c) => s + c.a / Math.pow(1 + r, (c.d - t0) / 31557600000), 0);
  let lo = -0.95, hi = 10; if (f(lo) * f(hi) > 0) return null;
  for (let i = 0; i < 80; i++) { const m = (lo + hi) / 2; if (f(lo) * f(m) <= 0) hi = m; else lo = m; }
  return (lo + hi) / 2;
}

  if (!$("#fc")) return;
  if (!L.length) { $("#fc").textContent = "הוסיפו השקעות כדי לראות תחזית."; return; }
  $("#fc").outerHTML = `<div class="card"><h2>הנחות לכל השקעה</h2><div class="muted">לכל השקעה הפקדה חודשית ותשואה צפויה משלה. דמי הניהול נלקחים מהגדרות ההשקעה. התוצאה היא סכום כל ההשקעות.</div></div>
    ${S.fcL.map((o, i) => `<div class="card"><b>${esc(o.x.name)}</b><div class="muted">${fmt(o.x.val)} · דמי ניהול ${o.x.fee_pct || 0}% ${o.x.fee_basis === "profit" ? "מהרווח" : "מהצבירה"}</div>
      <div class="row"><div style="flex:1"><label>הפקדה חודשית (₪)</label><input id="fm${i}" inputmode="decimal" dir="ltr" value="${o.mo}" oninput="drawFc()"></div>
      <div style="flex:1"><label>תשואה שנתית (%)</label><input id="fr${i}" inputmode="decimal" dir="ltr" value="${o.r}" oninput="drawFc()"></div></div></div>`).join("")}
    <button class="ghost" onclick="saveFc()">שמירת ההנחות</button><div id="fcr" style="margin-top:12px"></div>`;
  drawFc();
}
function drawFc() {
  S.fcL.forEach((o, i) => { o.mo = parseFloat($("#fm" + i).value) || 0; o.r = parseFloat($("#fr" + i).value) || 0; });
  const sims = sh => S.fcL.map(o => calc({ init: o.x.val, mo: o.mo, rate: o.r + sh, yrs: 30, step: 0, lump: 0, lumpYr: 0 }, o.x.fee_pct || 0, o.x.fee_basis || "balance"));
  const T = [-2, 0, 2].map(sims), tot = (A, y) => A.reduce((s, r) => s + r[y].b, 0), base = T[1], ser = k => Array.from({ length: 31 }, (_, y) => base.reduce((s, r) => s + r[y][k], 0));
  $("#fcr").innerHTML = `<div class="card"><h2>סך כל ההשקעות</h2><div style="display:flex;padding:6px 0" class="muted"><span style="flex:1">בעוד</span><span style="flex:2;text-align:end">זהיר</span><span style="flex:2;text-align:end">בסיס</span><span style="flex:2;text-align:end">אופטימי</span></div>
    ${[5, 10, 20, 30].map(y => `<div style="display:flex;padding:10px 0;border-top:1px solid var(--line)"><b style="flex:1">${y} שנים</b>${T.map((A, i) => `<span style="flex:2;text-align:end;${i === 1 ? "font-weight:700" : ""}">${fmt(tot(A, y))}</span>`).join("")}</div>`).join("")}
    <div class="muted">זהיר ואופטימי: שני אחוזים פחות או יותר בתשואה של כל השקעה.</div>${lines(ser("b"), ser("d"))}<div class="muted">קו מלא: בסיס · מקווקו: הפקדות. תחזית תיאורטית, לא הבטחה.</div></div>
    <div class="card"><h2>לפי השקעה (תרחיש בסיס)</h2>${S.fcL.map((o, i) => `<div style="display:flex;gap:8px;padding:10px 0;border-top:1px solid var(--line)"><b style="flex:2">${esc(o.x.name)}</b><span style="flex:2;text-align:end">${fmt(base[i][10].b)}<div class="muted">10 שנים</div></span><span style="flex:2;text-align:end">${fmt(base[i][20].b)}<div class="muted">20 שנים</div></span></div>`).join("")}</div>`;
}
async function saveFc() {
  const rs = await Promise.all(S.fcL.map(o => SB.from("investments").update({ monthly_deposit: o.mo, expected_return: o.r }).eq("id", o.x.id))), e = rs.find(r => r.error);
  toast(e ? "השמירה נכשלה: " + e.error.message : "ההנחות נשמרו ✓");
}
async function drawLiab() {
  const el = $("#liab"); if (!el) return;
  const r = await SB.from("liabilities").select("*").order("name"); if (!$("#liab")) return;
  if (r.error) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="card"><h2>התחייבויות</h2>${r.data.map(x => `<div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)"><div style="flex:1;cursor:pointer" onclick="editLiab('${x.id}',${x.balance})"><b>${esc(x.name)}</b><div class="muted">עודכן ${esc(x.as_of)}</div></div><b>${fmt(x.balance)}</b><button class="ghost" style="width:auto;margin:0;padding:6px 10px" onclick="delLiab('${x.id}')">✕</button></div>`).join("") || '<div class="muted">למשל משכנתא או הלוואה. הן יופחתו מההון כדי להציג הון נקי.</div>'}<button class="ghost" onclick="addLiab()">הוספת התחייבות</button></div>`;
}
function addLiab() { const n = (prompt("שם ההתחייבות (למשל משכנתא):") || "").trim(); if (!n) return; sheet("יתרת ההתחייבות", "סכום (₪)", async (a, dt) => { const r = await SB.from("liabilities").insert({ household_id: S.m.household_id, name: n, balance: a, as_of: dt }); toast(r.error ? r.error.message : "נשמר ✓"); render(); }); }
function editLiab(id, cur) { sheet("עדכון יתרה", "סכום (₪)", async (a, dt) => { const r = await SB.from("liabilities").update({ balance: a, as_of: dt }).eq("id", id); toast(r.error ? r.error.message : "עודכן ✓"); render(); }, cur); }
async function delLiab(id) { if (!confirm("למחוק את ההתחייבות?")) return; await SB.from("liabilities").delete().eq("id", id); render(); }
function monthRet(id) {
  const x = S.cur;
  sheet("תשואה חודשית שפורסמה", "אחוז, למשל 1.2 או -0.8", async (a, dt) => {
    const r = await SB.from("valuations").insert({ investment_id: id, value: x.val * (1 + a / 100), as_of: dt, source: "public", source_label: "תשואה חודשית " + a + "% (נתון ציבורי)" });
    toast(r.error ? r.error.message : "עודכן ✓"); render();
  }, undefined, undefined, false, true);
}

const yearlyOf = x => x.premium ? (x.frequency === "monthly" ? 12 : 1) * Number(x.premium) : 0;
function insStat(x) {
  if (!x.end_date) return { t: "ללא תאריך", c: "var(--muted)" };
  const n = Math.ceil((new Date(x.end_date) - Date.now()) / 864e5);
  return n < 0 ? { t: "פג תוקף", c: "var(--bad)" } : n <= 30 ? { t: "עוד " + n + " ימים", c: "var(--bad)" } : n <= 60 ? { t: "עוד " + n + " ימים", c: "#D97706" } : { t: "עד " + x.end_date, c: "var(--muted)" };
}
function drawIns() {
  const L = S.insL, yr = L.reduce((a, x) => a + yearlyOf(x), 0), nm = Object.fromEntries(S.mem.map(m => [m.user_id, m.display_name])), G = {};
  L.forEach(x => (G[x.kind || "אחר"] = G[x.kind || "אחר"] || []).push(x));
  const gr = Object.entries(G).map(([k, a]) => ({ k, a, y: a.reduce((s, x) => s + yearlyOf(x), 0) })).sort((a, b) => b.y - a.y);
  $("#ib").innerHTML = `<div class="hero"><div class="lbl">עלות ביטוחים שנתית</div><div class="hbig">${fmt(yr)}</div><div class="chip">כ-${fmt(yr / 12)} לחודש</div><div class="sm">${L.length} פוליסות</div></div>
    <button style="margin-top:12px" onclick="S.insf=1;S.insEd=null;render()">הוספת ביטוח</button>` +
    (gr.map((g, i) => `<div style="margin:20px 0 8px;display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:3px;background:${PAL[i % 8]}"></span><b style="flex:1">${esc(g.k)}</b><b>${fmt(g.y)}</b><span class="muted">לשנה</span></div>` +
      g.a.map(x => { const st = insStat(x); return `<div class="card" style="border-inline-start:4px solid ${PAL[i % 8]};cursor:pointer;padding:14px 16px;margin-bottom:8px" onclick="S.insEd=S.insL.find(z=>z.id==='${x.id}');S.insf=1;render()">
        <div style="display:flex;justify-content:space-between;gap:10px"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.company || "")}${x.company ? " · " : ""}${x.owner_user_id ? esc(nm[x.owner_user_id] || "") : "משותף"}</div></div>
        <div style="text-align:end"><b>${x.premium ? fmt(x.premium) : "—"}</b><div class="muted">${x.frequency === "monthly" ? "לחודש" : "לשנה"}</div></div></div>
        <div style="margin-top:6px;font-size:14px;font-weight:600;color:${st.c}">${st.t}</div></div>`; }).join("")).join("") || `<div class="muted" style="margin-top:16px">עדיין אין ביטוחים. הוסיפו את הראשון.</div>`);
}
function insForm() {
  const x = S.insEd || {}, dl = (id, a) => `<datalist id="${id}">${a.map(v => `<option value="${v}">`).join("")}</datalist>`;
  V(`<button class="ghost" onclick="S.insf=0;S.insEd=null;render()">→ ביטול</button><div class="card" style="margin-top:12px"><h2>${S.insEd ? "עריכת ביטוח" : "ביטוח חדש"}</h2>
    <label>שם הפוליסה</label><input id="i_n" value="${esc(x.name || "")}" placeholder="למשל ביטוח רכב">
    <label>סוג</label><input id="i_k" list="dk" value="${esc(x.kind || "")}">${dl("dk", ["בריאות", "חיים", "רכב", "דירה", "אובדן כושר עבודה", "סיעודי", "נסיעות", "אחר"])}
    <label>חברת הביטוח</label><input id="i_c" list="dc" value="${esc(x.company || "")}">${dl("dc", ["הראל", "מגדל", "הפניקס", "כלל", "מנורה", "הכשרה", "איילון", "ביטוח ישיר", "שלמה", "AIG", "שירביט", "ליברה"])}
    <label>על שם</label><select id="i_o"><option value="">משותף</option>${opt(S.mem, "user_id", "display_name")}</select>
    <div class="row"><div style="flex:1"><label>מחיר (₪)</label><input id="i_p" inputmode="decimal" dir="ltr" value="${x.premium == null ? "" : x.premium}"></div>
    <div style="flex:1"><label>תשלום</label><select id="i_f"><option value="monthly">לחודש</option><option value="yearly">לשנה</option></select></div></div>
    <div class="row"><div style="flex:1"><label>תחילת תוקף</label><input id="i_s" type="date" dir="ltr" value="${x.start_date || ""}"></div>
    <div style="flex:1"><label>סיום תוקף / חידוש</label><input id="i_e" type="date" dir="ltr" value="${x.end_date || ""}"></div></div>
    <label>הערות</label><input id="i_t" value="${esc(x.notes || "")}">
    <button onclick="saveIns()">שמירה</button>${S.insEd ? `<button class="ghost" style="color:var(--bad)" onclick="delIns('${x.id}')">מחיקת הביטוח</button>` : ""}</div>`);
  $("#i_o").value = x.owner_user_id || ""; $("#i_f").value = x.frequency || "monthly";
}
async function saveIns() {
  const n = $("#i_n").value.trim(); if (!n) return alert("יש להזין שם לפוליסה");
  const row = { name: n, kind: $("#i_k").value.trim() || null, company: $("#i_c").value.trim() || null, owner_user_id: $("#i_o").value || null,
    premium: parseFloat($("#i_p").value.replace(/,/g, "")) || null, frequency: $("#i_f").value, start_date: $("#i_s").value || null, end_date: $("#i_e").value || null, notes: $("#i_t").value.trim() || null };
  const r = S.insEd ? await SB.from("insurances").update(row).eq("id", S.insEd.id) : await SB.from("insurances").insert({ household_id: S.m.household_id, ...row });
  if (r.error) return alert(r.error.message);
  S.insf = 0; S.insEd = null; toast("נשמר ✓"); render();
}
async function delIns(id) { if (!confirm("למחוק את הביטוח?")) return; await SB.from("insurances").delete().eq("id", id); S.insf = 0; S.insEd = null; render(); }
async function homeIns(f) {
  if (f !== "all") return;
  const r = await SB.from("insurances").select("id,name,company,end_date"); if (r.error || !$("#view")) return;
  const due = (r.data || []).filter(x => x.end_date).map(x => ({ ...x, n: Math.ceil((new Date(x.end_date) - Date.now()) / 864e5) })).filter(x => x.n <= 45).sort((a, b) => a.n - b.n);
  if (!due.length) return;
  $("#view").insertAdjacentHTML("beforeend", `<div class="card"><h2>ביטוחים לחידוש</h2>${due.slice(0, 6).map(x => `<div style="display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);cursor:pointer" onclick="S.tab='ins';render()"><span><b>${esc(x.name)}</b> <span class="muted">${esc(x.company || "")}</span></span><b style="color:var(--bad)">${x.n < 0 ? "פג תוקף" : x.n === 0 ? "היום" : "עוד " + x.n + " ימים"}</b></div>`).join("")}</div>`);
}
const toggleHide = () => { S.hide = !S.hide; try { localStorage.setItem("hide", S.hide ? "1" : "0"); } catch (e) {} render(); };

boot();
</script>
</body>
</html>
