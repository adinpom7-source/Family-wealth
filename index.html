<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הון משפחתי</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הון">
<meta name="theme-color" content="#0f766e">
<style>
:root{--bg:#f3f5f7;--card:#fff;--text:#0f1b24;--muted:#6b7885;--line:#e5e9ed;--accent:#0f766e;--on:#fff;--bad:#c2410c;--sh:0 1px 2px #0000000a,0 6px 20px #0f1b240d}
:root[data-theme=dark]{--bg:#0b1115;--card:#141c23;--text:#eaf0f5;--muted:#8b9aa8;--line:#222d37;--accent:#2dd4bf;--on:#04201c;--bad:#fb923c;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#app{min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
header h1{font-size:20px;font-weight:700;margin:0}
main{flex:1;padding:6px 16px 100px;max-width:640px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--sh)}
.muted{color:var(--muted);font-size:14px}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.n{font-size:20px;font-weight:700}
h2{font-size:17px;font-weight:700;margin:0 0 12px}
label{font-size:14px;color:var(--muted)}
input,select{width:100%;padding:14px;margin:6px 0 10px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 16px;background:var(--accent);color:var(--on);font-weight:700;width:100%;margin-top:6px;transition:transform .1s}
button:active{transform:scale(.98)}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.icon{width:auto;padding:8px 12px;margin:0}
.err{color:var(--bad);font-size:14px;min-height:20px}
.wrap{max-width:420px;margin:0 auto;padding:28px 18px}
.row{display:flex;gap:12px}.row .card{flex:1}
.card[onclick]{cursor:pointer}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;color:var(--muted);margin:0;padding:8px 2px;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
nav button .i{font-size:21px}
nav button.on{color:var(--accent);font-weight:700}
.code{font:700 22px ui-monospace,monospace;letter-spacing:2px;direction:ltr;text-align:center;padding:10px;background:var(--bg);border-radius:12px}
.hero{background:linear-gradient(135deg,#0f766e,#0e9f8e);color:#fff;border-radius:24px;padding:22px;margin-bottom:12px;box-shadow:0 10px 30px #0f766e40}
:root[data-theme=dark] .hero{background:linear-gradient(135deg,#115e59,#0f766e);box-shadow:none}
.hero .lbl{opacity:.85;font-size:14px}.hero .sm{font-size:12px;opacity:.7;margin-top:10px}
.hbig{font-size:42px;font-weight:800;letter-spacing:-1px;line-height:1.15;margin:2px 0 10px}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;background:#ffffff26;font-weight:600;font-size:14px}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.seg button{width:auto;white-space:nowrap;margin:0;padding:8px 16px;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:14px}
.seg button.on{background:var(--accent);color:var(--on);border-color:transparent}
.donutw{display:flex;align-items:center;gap:18px}
.leg{flex:1;font-size:14px}.leg div{display:flex;align-items:center;gap:8px;margin:5px 0}.leg b{margin-inline-start:auto}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:20}
.sh{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.toast{position:fixed;bottom:92px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:30;font-weight:600}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
const SB = supabase.createClient(
  "https://bshlkzsfabfosgatcfii.supabase.co",
  "sb_publishable_KNOPqZIot1eZ11t4ndmaJQ_3T8v1EOR"   // public key, safe in the browser
);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = { tab: "home", m: null };

/* ---------- theme ---------- */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("theme", t); } catch (e) {}
}
(function () {
  let t = null;
  try { t = localStorage.getItem("theme"); } catch (e) {}
  setTheme(t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
})();
const toggleTheme = () => { setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); render(); };

/* ---------- boot ---------- */
async function boot() {
  const { data: { session } } = await SB.auth.getSession();
  if (!session) return authView();
  const { data, error } = await SB.from("household_members")
    .select("household_id,display_name,households(name,join_code)")
    .eq("user_id", session.user.id).maybeSingle();
  if (error) return fatal(error.message);
  if (!data) return onboardView();
  S.m = data; render();
}
function fatal(msg) {
  $("#app").innerHTML = `<div class="wrap"><div class="card"><h2>משהו השתבש</h2><div class="err">${esc(msg)}</div><button onclick="boot()">נסה שוב</button></div></div>`;
}

/* ---------- auth ---------- */
function authView(msg = "") {
  $("#app").innerHTML = `<div class="wrap">
    <h1>הון משפחתי</h1><p class="muted">כניסה או יצירת חשבון</p>
    <div class="card">
      <label>אימייל</label><input id="em" type="email" autocomplete="email" dir="ltr">
      <label>סיסמה (לפחות 8 תווים)</label><input id="pw" type="password" autocomplete="current-password" dir="ltr">
      <div class="err" id="err">${esc(msg)}</div>
      <button onclick="doAuth('in')">כניסה</button>
      <button class="ghost" onclick="doAuth('up')">יצירת חשבון חדש</button>
    </div></div>`;
}
async function doAuth(mode) {
  const email = $("#em").value.trim(), password = $("#pw").value;
  if (!email || password.length < 8) return ($("#err").textContent = "יש להזין אימייל וסיסמה של 8 תווים לפחות");
  const { data, error } = mode === "in"
    ? await SB.auth.signInWithPassword({ email, password })
    : await SB.auth.signUp({ email, password });
  if (error) return ($("#err").textContent = error.message);
  if (!data.session) return ($("#err").textContent = "החשבון נוצר. אם נדרש אימות במייל, אשרו אותו ואז היכנסו.");
  boot();
}
const signOut = async () => { await SB.auth.signOut(); S.m = null; boot(); };

/* ---------- household onboarding ---------- */
function onboardView(msg = "") {
  $("#app").innerHTML = `<div class="wrap">
    <h1>ברוכים הבאים</h1><p class="muted">מי ראשון יוצר משפחה, והשני מצטרף עם קוד.</p>
    <div class="card"><h2>יצירת משפחה חדשה</h2>
      <label>השם שלך</label><input id="n1">
      <button onclick="createHH()">יצירה</button></div>
    <div class="card"><h2>הצטרפות עם קוד</h2>
      <label>השם שלך</label><input id="n2">
      <label>קוד הצטרפות</label><input id="cd" dir="ltr">
      <button class="ghost" onclick="joinHH()">הצטרפות</button></div>
    <div class="err" id="err">${esc(msg)}</div>
    <button class="ghost" onclick="signOut()">יציאה</button></div>`;
}
async function createHH() {
  const n = $("#n1").value.trim(); if (!n) return ($("#err").textContent = "יש להזין שם");
  const { error } = await SB.rpc("create_household", { p_name: "המשפחה", p_display: n });
  error ? ($("#err").textContent = error.message) : boot();
}
async function joinHH() {
  const n = $("#n2").value.trim(), c = $("#cd").value.trim();
  if (!n || !c) return ($("#err").textContent = "יש להזין שם וקוד");
  const { error } = await SB.rpc("join_household", { p_code: c, p_display: n });
  error ? ($("#err").textContent = "קוד לא תקין") : boot();
}

/* ---------- app shell ---------- */
const TABS = [["home","🏠","בית"],["inv","📈","השקעות"],["goals","🎯","מטרות"],["more","⚙️","עוד"]];
function render() {
  const dark = document.documentElement.dataset.theme === "dark";
  $("#app").innerHTML = `
    <header><h1>${esc(S.m.households.name)}</h1>
      <button class="ghost icon" onclick="toggleTheme()" aria-label="מצב כהה/בהיר">${dark ? "☀️" : "🌙"}</button></header>
    <main id="view"></main>
    <nav>${TABS.map(([k,i,l]) => `<button class="${S.tab===k?"on":""}" onclick="go('${k}')"><span class="i">${i}</span>${l}</button>`).join("")}</nav>`;
  views[S.tab]();
}
const go = t => { S.tab = t; S.sel = S.add = S.ed = null; render(); };
const fmt = n => new Intl.NumberFormat("he-IL", { style: "currency", currency: "ILS", maximumFractionDigits: 0 }).format(n || 0);
const today = () => new Date().toISOString().slice(0, 10);
const V = h => ($("#view").innerHTML = h);
const opt = (a, k, l) => (a || []).map(x => `<option value="${esc(x[k])}">${esc(x[l])}</option>`).join("");

async function loadAll() {
  const [i, t, v] = await Promise.all([
    SB.from("investments").select("*,institutions(name),asset_types(name)").eq("archived", false).order("created_at"),
    SB.from("transactions").select("investment_id,kind,amount"),
    SB.from("valuations").select("investment_id,value,as_of,created_at").order("as_of", { ascending: false }).order("created_at", { ascending: false })]);
  const err = i.error || t.error || v.error; if (err) throw err;
  const dep = {}, val = {};
  t.data.forEach(x => dep[x.investment_id] = (dep[x.investment_id] || 0) + (x.kind === "deposit" ? 1 : -1) * Number(x.amount));
  v.data.forEach(x => { if (!(x.investment_id in val)) val[x.investment_id] = x; });
  return i.data.map(r => { const d = dep[r.id] || 0, l = val[r.id]; return { ...r, dep: d, val: l ? Number(l.value) : d, asOf: l && l.as_of, hasVal: !!l }; });
}

async function members() {
  if (!S.mem) { const r = await SB.from("household_members").select("user_id,display_name"); S.mem = r.data || []; }
  return S.mem;
}
function donut(items) {
  const T = items.reduce((a, x) => a + x.v, 0), C = ["#0f766e", "#14b8a6", "#6366f1", "#f59e0b", "#ec4899", "#64748b", "#84cc16", "#06b6d4"];
  let off = 25;
  const segs = items.map((x, i) => { const p = x.v / T * 100, s = `<circle cx="21" cy="21" r="15.915" fill="none" stroke="${C[i % 8]}" stroke-width="6" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${off}"/>`; off -= p; return s; }).join("");
  return `<div class="donutw"><svg viewBox="0 0 42 42" width="130" height="130">${segs}</svg><div class="leg">${items.map((x, i) => `<div><i style="background:${C[i % 8]}"></i>${esc(x.n)}<b>${Math.round(x.v / T * 100)}%</b></div>`).join("")}</div></div>`;
}
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function sheet(title, label, cb, def) {
  const d = document.createElement("div"); d.className = "ov";
  d.innerHTML = `<div class="sh"><h2>${esc(title)}</h2><label>${esc(label)}</label><input id="sv" inputmode="decimal" dir="ltr" placeholder="0"><button id="ok">אישור</button><button class="ghost" id="no">ביטול</button></div>`;
  document.body.appendChild(d);
  const c = () => d.remove(); d.onclick = e => { if (e.target === d) c(); };
  $("#no").onclick = c;
  $("#ok").onclick = async () => { const a = parseFloat($("#sv").value.replace(/,/g, "")); if (isNaN(a) || a < 0) return; c(); await cb(a); };
  if (def !== undefined) $("#sv").value = def; $("#sv").focus();
}

const views = {
  async home() {
    V(`<div class="hero"><div class="lbl">טוען…</div><div class="hbig">&nbsp;</div></div>`);
    try {
      const [L0, mem] = await Promise.all([loadAll(), members()]);
      if (!$("#view")) return;
      const f = S.f || "all";
      const L = L0.filter(x => f === "all" || (f === "joint" ? !x.owner_user_id : x.owner_user_id === f));
      const v = L.reduce((a, x) => a + x.val, 0), d = L.reduce((a, x) => a + x.dep, 0), p = v - d, pct = d > 0 ? p / d * 100 : 0;
      const g = {}; L.forEach(x => { const k = (x.asset_types && x.asset_types.name) || "ללא סוג"; g[k] = (g[k] || 0) + x.val; });
      const items = Object.entries(g).map(([n, v]) => ({ n, v })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
      const seg = [["all", "משפחה"], ...mem.map(m => [m.user_id, m.display_name]), ["joint", "משותף"]];
      V(`<div class="seg">${seg.map(([k, l]) => `<button class="${f === k ? "on" : ""}" onclick="S.f='${k}';render()">${esc(l)}</button>`).join("")}</div>
        <div class="hero"><div class="lbl">סך ההון</div><div class="hbig">${fmt(v)}</div>
          <div class="chip">${p >= 0 ? "▲" : "▼"} ${fmt(Math.abs(p))}${d > 0 ? ` · ${Math.abs(pct).toFixed(1)}%` : ""}</div>
          <div class="sm">לפי עדכוני שווי שהוזנו, לא שווי רשמי</div></div>
        <div class="row"><div class="card"><div class="muted">הפקדות נטו</div><div class="n">${fmt(d)}</div></div>
          <div class="card"><div class="muted">רווח / הפסד</div><div class="n" style="color:var(${p >= 0 ? "--accent" : "--bad"})">${fmt(p)}</div></div></div>
        ${items.length ? `<div class="card"><h2>חלוקה לפי סוג</h2>${donut(items)}</div>` : `<div class="card muted">עדיין אין השקעות. הוסיפו את הראשונה בלשונית "השקעות".</div>`}`);
    } catch (e) { V(`<div class="err">${esc(e.message)}</div>`); }
  },
  async inv() {
    if (S.sel) return detail(S.sel);
    if (S.add) return addForm();
    V(`<button onclick="S.add=1;render()">➕ השקעה חדשה</button><div id="list" class="muted" style="margin-top:14px">טוען…</div>`);
    try {
      const L = await loadAll(); if (!$("#list")) return;
      $("#list").innerHTML = L.length ? L.map(x => `<div class="card" onclick="S.sel='${x.id}';render()"><b>${esc(x.name)}</b>
        <div class="muted">${esc(x.institutions && x.institutions.name || "")} · ${esc(x.asset_types && x.asset_types.name || "")}</div>
        <div class="big" style="font-size:24px">${fmt(x.val)}</div>
        <div class="muted">${x.hasVal ? "עודכן " + esc(x.asOf) : "ללא עדכון שווי"}</div></div>`).join("") : "עדיין אין השקעות.";
    } catch (e) { $("#list").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  },
  goals() { V(`<div class="card"><h2>מטרות</h2><div class="muted">בקרוב: מטרות עם סכום יעד, תאריך והתקדמות.</div></div>`); },
  more() {
    V(`<div class="card"><h2>שלום ${esc(S.m.display_name)}</h2><div class="muted">קוד להצטרפות בן/בת הזוג:</div>
      <div class="code">${esc(S.m.households.join_code)}</div></div>
      <div class="card"><button class="ghost" onclick="signOut()">יציאה</button></div>`);
  }
};

async function detail(id) {
  V("טוען…");
  const [all, tr, va] = await Promise.all([loadAll(),
    SB.from("transactions").select("id,kind,amount,occurred_on").eq("investment_id", id),
    SB.from("valuations").select("id,value,as_of").eq("investment_id", id)]);
  const x = all.find(r => r.id === id);
  if (!x) { S.sel = null; return render(); }
  S.cur = x;
  const ev = [...(tr.data || []).map(e => ({ t: "tx", id: e.id, l: e.kind === "deposit" ? "הפקדה" : "משיכה", a: Number(e.amount), d: e.occurred_on })),
    ...(va.data || []).map(e => ({ t: "val", id: e.id, l: "עדכון שווי", a: Number(e.value), d: e.as_of }))].sort((a, b) => b.d.localeCompare(a.d));
  const row = e => `<div style="display:flex;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line)">
    <div style="flex:1;cursor:pointer" onclick="editEv('${e.t}','${e.id}',${e.a})"><b>${e.l}</b><div class="muted">${esc(e.d)}</div></div>
    <b>${fmt(e.a)}</b><button class="ghost" style="width:auto;margin:0;padding:6px 10px" onclick="delEv('${e.t}','${e.id}')" aria-label="מחיקה">✕</button></div>`;
  V(`<button class="ghost" onclick="S.sel=null;render()">→ חזרה</button>
    <div class="card" style="margin-top:12px"><h2>${esc(x.name)}</h2><div class="big">${fmt(x.val)}</div>
      <div class="muted">${x.hasVal ? "עודכן " + esc(x.asOf) + " · מקור: הוזן ידנית" : "אין עדכון שווי, מוצג סכום ההפקדות"}</div>
      <p>הפקדות נטו: <b>${fmt(x.dep)}</b><br>רווח / הפסד: <b>${fmt(x.val - x.dep)}</b></p></div>
    <button onclick="act('${id}','deposit')">הפקדה</button>
    <button class="ghost" onclick="act('${id}','withdrawal')">משיכה</button>
    <button class="ghost" onclick="act('${id}','valuation')">עדכון שווי</button>
    <div class="card" style="margin-top:14px"><h2>היסטוריה</h2>${ev.length ? ev.map(row).join("") : '<div class="muted">אין עדיין תנועות.</div>'}
      ${ev.length ? '<div class="muted" style="margin-top:8px">הקשה על שורה לעריכת הסכום.</div>' : ""}</div>
    <button class="ghost" onclick="S.ed=S.cur;S.sel=null;S.add=1;render()">עריכת פרטי ההשקעה</button>
    <button class="ghost" style="color:var(--bad)" onclick="delInv('${id}')">מחיקת ההשקעה</button>`);
}
function editEv(t, id, cur) {
  sheet(t === "tx" ? "עריכת תנועה" : "עריכת שווי", "סכום (₪)", async a => {
    if (t === "tx" && a === 0) return;
    const r = t === "tx" ? await SB.from("transactions").update({ amount: a }).eq("id", id) : await SB.from("valuations").update({ value: a }).eq("id", id);
    toast(r.error ? r.error.message : "עודכן ✓"); render();
  }, cur);
}
async function delEv(t, id) {
  if (!confirm("למחוק את הרשומה?")) return;
  const r = await SB.from(t === "tx" ? "transactions" : "valuations").delete().eq("id", id);
  toast(r.error ? r.error.message : "נמחק"); render();
}
async function delInv(id) {
  if (!confirm("למחוק את ההשקעה וכל ההיסטוריה שלה? אי אפשר לשחזר.")) return;
  const r = await SB.from("investments").delete().eq("id", id);
  if (r.error) return alert(r.error.message);
  S.sel = null; toast("נמחק"); render();
}
function cancelForm() { const e = S.ed; S.add = 0; S.ed = null; S.dn = ""; S.sel = e ? e.id : null; render(); }
function act(id, kind) {
  const T = { deposit: ["הפקדה", "סכום ההפקדה (₪)"], withdrawal: ["משיכה", "סכום המשיכה (₪)"], valuation: ["עדכון שווי", "השווי הנוכחי (₪)"] }[kind];
  sheet(T[0], T[1], async a => {
    if (kind !== "valuation" && a === 0) return;
    const r = kind === "valuation"
      ? await SB.from("valuations").insert({ investment_id: id, value: a, as_of: today(), source: "reported", source_label: "הוזן ידנית" })
      : await SB.from("transactions").insert({ investment_id: id, kind, amount: a, occurred_on: today() });
    toast(r.error ? r.error.message : "נשמר ✓"); render();
  });
}

async function addForm() {
  V("טוען…");
  const [ins, ty, mem] = await Promise.all([
    SB.from("institutions").select("id,name").order("name"), SB.from("asset_types").select("id,name").order("name"),
    SB.from("household_members").select("user_id,display_name")]);
  const empty = !(ins.data || []).length && !(ty.data || []).length;
  V(`<button class="ghost" onclick="cancelForm()">→ ביטול</button>
    <div class="card" style="margin-top:12px"><h2>${S.ed ? "עריכת השקעה" : "השקעה חדשה"}</h2>
    <label>שם</label><input id="f_n" value="${esc(S.dn || (S.ed && S.ed.name) || "")}">
    ${empty ? `<button class="ghost" onclick="seed()">הוסף רשימה מוכנה של בתי השקעות וסוגים</button><br><br>` : ""}
    <label>בית השקעות</label><select id="f_i"><option value="">—</option>${opt(ins.data, "id", "name")}</select>
    <button class="ghost" onclick="newItem('institutions')">➕ בית השקעות חדש</button><br><br>
    <label>סוג השקעה</label><select id="f_t"><option value="">—</option>${opt(ty.data, "id", "name")}</select>
    <button class="ghost" onclick="newItem('asset_types')">➕ סוג חדש</button><br><br>
    <label>בעלות</label><select id="f_o"><option value="">משותף</option>${opt(mem.data, "user_id", "display_name")}</select><br><br>
    <label>טווח</label><select id="f_h"><option value="long">ארוך</option><option value="medium">בינוני</option><option value="short">קצר</option></select><br><br>
    <label>מסלול (אופציונלי)</label><input id="f_k">
    <label>דמי ניהול שנתיים באחוזים (אופציונלי)</label><input id="f_f" inputmode="decimal" dir="ltr">
    <button onclick="saveInv()">שמירה</button></div>`);
  if (S.ed) { const e = S.ed; $("#f_i").value = e.institution_id || ""; $("#f_t").value = e.type_id || ""; $("#f_o").value = e.owner_user_id || "";
    $("#f_h").value = e.horizon; $("#f_k").value = e.track || ""; $("#f_f").value = e.fee_pct == null ? "" : e.fee_pct; }
}
async function newItem(tbl) {
  S.dn = $("#f_n").value;
  const name = (prompt("שם:") || "").trim(); if (!name) return;
  const row = { household_id: S.m.household_id, name };
  if (tbl === "asset_types") row.bucket = { "1": "savings", "3": "property" }[prompt("קטגוריה: 1 = חיסכון/פנסיה, 2 = השקעות, 3 = נכסים", "2")] || "investments";
  const r = await SB.from(tbl).insert(row); if (r.error) alert(r.error.message);
  render();
}
async function seed() {
  const h = S.m.household_id;
  await SB.from("institutions").insert(["מיטב", "אלטשולר שחם", "מור", "הפניקס", "הראל", "מנורה"].map(name => ({ household_id: h, name })));
  await SB.from("asset_types").insert([["תיק עצמאי","investments"],["קרן מחקה מדד","investments"],["קרן סל (ETF)","investments"],["מניות","investments"],["אג״ח","investments"],["קרן השתלמות","savings"],["קופת גמל","savings"],["פנסיה","savings"],["נדל״ן","property"],["השקעה אלטרנטיבית","investments"]].map(([name, bucket]) => ({ household_id: h, name, bucket })));
  S.dn = $("#f_n").value; render();
}
async function saveInv() {
  const n = $("#f_n").value.trim(); if (!n) return alert("יש להזין שם");
  const row = { name: n, institution_id: $("#f_i").value || null, type_id: $("#f_t").value || null, owner_user_id: $("#f_o").value || null,
    horizon: $("#f_h").value, track: $("#f_k").value || null, fee_pct: parseFloat($("#f_f").value) || null };
  const r = S.ed ? await SB.from("investments").update(row).eq("id", S.ed.id)
                 : await SB.from("investments").insert({ household_id: S.m.household_id, ...row });
  if (r.error) return alert(r.error.message);
  const back = S.ed ? S.ed.id : null;
  S.add = 0; S.ed = null; S.dn = ""; S.sel = back; toast("נשמר ✓"); render();
}

boot();
</script>
</body>
</html>
