<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הון משפחתי</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הון">
<meta name="theme-color" content="#0f766e">
<style>
:root{--bg:#f3f5f7;--card:#fff;--text:#0f1b24;--muted:#6b7885;--line:#e5e9ed;--accent:#0f766e;--on:#fff;--bad:#c2410c;--sh:0 1px 2px #0000000a,0 6px 20px #0f1b240d}
:root[data-theme=dark]{--bg:#0b1115;--card:#141c23;--text:#eaf0f5;--muted:#8b9aa8;--line:#222d37;--accent:#2dd4bf;--on:#04201c;--bad:#fb923c;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#app{min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px}
header h1{font-size:20px;font-weight:700;margin:0}
main{flex:1;padding:6px 16px 100px;max-width:640px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--sh)}
.muted{color:var(--muted);font-size:14px}
.big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.n{font-size:20px;font-weight:700}
h2{font-size:17px;font-weight:700;margin:0 0 12px}
label{font-size:14px;color:var(--muted)}
input,select{width:100%;padding:14px;margin:6px 0 10px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 16px;background:var(--accent);color:var(--on);font-weight:700;width:100%;margin-top:6px;transition:transform .1s}
button:active{transform:scale(.98)}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.icon{width:auto;padding:8px 12px;margin:0}
.err{color:var(--bad);font-size:14px;min-height:20px}
.wrap{max-width:420px;margin:0 auto;padding:28px 18px}
.row{display:flex;gap:12px}.row .card{flex:1}
.card[onclick]{cursor:pointer}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;color:var(--muted);margin:0;padding:8px 2px;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px}
nav button .i{font-size:21px}
nav button.on{color:var(--accent);font-weight:700}
.code{font:700 22px ui-monospace,monospace;letter-spacing:2px;direction:ltr;text-align:center;padding:10px;background:var(--bg);border-radius:12px}
.hero{background:linear-gradient(135deg,#0f766e,#0e9f8e);color:#fff;border-radius:24px;padding:22px;margin-bottom:12px;box-shadow:0 10px 30px #0f766e40}
:root[data-theme=dark] .hero{background:linear-gradient(135deg,#115e59,#0f766e);box-shadow:none}
.hero .lbl{opacity:.85;font-size:14px}.hero .sm{font-size:12px;opacity:.7;margin-top:10px}
.hbig{font-size:42px;font-weight:800;letter-spacing:-1px;line-height:1.15;margin:2px 0 10px}
.chip{display:inline-block;padding:4px 12px;border-radius:999px;background:#ffffff26;font-weight:600;font-size:14px}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.seg button{width:auto;white-space:nowrap;margin:0;padding:8px 16px;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:14px}
.seg button.on{background:var(--accent);color:var(--on);border-color:transparent}
.donutw{display:flex;align-items:center;gap:18px}
.leg{flex:1;font-size:14px}.leg div{display:flex;align-items:center;gap:8px;margin:5px 0}.leg b{margin-inline-start:auto}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:20}
.sh{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.toast{position:fixed;bottom:92px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:30;font-weight:600}
/* theme v2: more color */
:root{--bg:#EEF2FF;--card:#fff;--text:#16203A;--muted:#66708C;--line:#E0E6F7;--accent:#0D9488;--bad:#E2531F;--sh:0 2px 4px #4f46e508,0 10px 28px #4f46e51a}
:root[data-theme=dark]{--bg:#1B2338;--card:#263250;--text:#EEF2FB;--muted:#9FACC9;--line:#364466;--accent:#5EEAD4;--bad:#FDA05A;--sh:0 8px 24px #0003}
body{background:linear-gradient(180deg,#D9E2FF 0,var(--bg) 340px) no-repeat var(--bg)}
:root[data-theme=dark] body{background:linear-gradient(180deg,#313C73 0,var(--bg) 340px) no-repeat var(--bg)}
.hero{background:linear-gradient(135deg,#4F46E5 0%,#0D9488 62%,#22C55E 100%);box-shadow:0 12px 32px #4f46e54d}
:root[data-theme=dark] .hero{background:linear-gradient(135deg,#4338CA 0%,#0F766E 100%);box-shadow:none}
button{background-image:linear-gradient(135deg,#4F46E5,#0D9488);color:#fff}
nav{backdrop-filter:blur(12px)}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
const SB = supabase.createClient(
  "https://bshlkzsfabfosgatcfii.supabase.co",
  "sb_publishable_KNOPqZIot1eZ11t4ndmaJQ_3T8v1EOR"   // public key, safe in the browser
);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = { tab: "home", m: null };

/* ---------- theme ---------- */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("theme", t); } catch (e) {}
}
(function () {
  let t = null;
  try { t = localStorage.getItem("theme"); } catch (e) {}
  setTheme(t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
})();
const toggleTheme = () => { setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); render(); };

/* ---------- boot ---------- */
async function boot() {
  const { data: { session } } = await SB.auth.getSession();
  if (!session) return authView();
  const { data, error } = await SB.from("household_members")
    .select("household_id,display_name,households(name,join_code)")
    .eq("user_id", session.user.id).maybeSingle();
  if (error) return fatal(error.message);
  if (!data) return onboardView();
  S.m = data; render();
}
function fatal(msg) {
  $("#app").innerHTML = `<div class="wrap"><div class="card"><h2>משהו השתבש</h2><div class="err">${esc(msg)}</div><button onclick="boot()">נסה שוב</button></div></div>`;
}

/* ---------- auth ---------- */
function authView(msg = "") {
  $("#app").innerHTML = `<div class="wrap">
    <h1>הון משפחתי</h1><p class="muted">כניסה או יצירת חשבון</p>
    <div class="card">
      <label>אימייל</label><input id="em" type="email" autocomplete="email" dir="ltr">
      <label>סיסמה (לפחות 8 תווים)</label><input id="pw" type="password" autocomplete="current-password" dir="ltr">
      <div class="err" id="err">${esc(msg)}</div>
      <button onclick="doAuth('in')">כניסה</button>
      <button class="ghost" onclick="doAuth('up')">יצירת חשבון חדש</button>
    </div></div>`;
}
async function doAuth(mode) {
  const email = $("#em").value.trim(), password = $("#pw").value;
  if (!email || password.length < 8) return ($("#err").textContent = "יש להזין אימייל וסיסמה של 8 תווים לפחות");
  const { data, error } = mode === "in"
    ? await SB.auth.signInWithPassword({ email, password })
    : await SB.auth.signUp({ email, password });
  if (error) return ($("#err").textContent = error.message);
  if (!data.session) return ($("#err").textContent = "החשבון נוצר. אם נדרש אימות במייל, אשרו אותו ואז היכנסו.");
  boot();
}
const signOut = async () => { await SB.auth.signOut(); S.m = null; boot(); };

/* ---------- household onboarding ---------- */
function onboardView(msg = "") {
  $("#app").innerHTML = `<div class="wrap">
    <h1>ברוכים הבאים</h1><p class="muted">מי ראשון יוצר משפחה, והשני מצטרף עם קוד.</p>
    <div class="card"><h2>יצירת משפחה חדשה</h2>
      <label>השם שלך</label><input id="n1">
      <button onclick="createHH()">יצירה</button></div>
    <div class="card"><h2>הצטרפות עם קוד</h2>
      <label>השם שלך</label><input id="n2">
      <label>קוד הצטרפות</label><input id="cd" dir="ltr">
      <button class="ghost" onclick="joinHH()">הצטרפות</button></div>
    <div class="err" id="err">${esc(msg)}</div>
    <button class="ghost" onclick="signOut()">יציאה</button></div>`;
}
async function createHH() {
  const n = $("#n1").value.trim(); if (!n) return ($("#err").textContent = "יש להזין שם");
  const { error } = await SB.rpc("create_household", { p_name: "המשפחה", p_display: n });
  error ? ($("#err").textContent = error.message) : boot();
}
async function joinHH() {
  const n = $("#n2").value.trim(), c = $("#cd").value.trim();
  if (!n || !c) return ($("#err").textContent = "יש להזין שם וקוד");
  const { error } = await SB.rpc("join_household", { p_code: c, p_display: n });
  error ? ($("#err").textContent = "קוד לא תקין") : boot();
}

/* ---------- app shell ---------- */
const TABS = [["home","🏠","בית"],["inv","📈","השקעות"],["goals","🎯","מטרות"],["tools","🧮","כלים"],["more","⚙️","עוד"]];
function render() {
  const dark = document.documentElement.dataset.theme === "dark";
  $("#app").innerHTML = `
    <header><h1>${esc(S.m.households.name)}</h1>
      <button class="ghost icon" onclick="toggleTheme()" aria-label="מצב כהה/בהיר">${dark ? "☀️" : "🌙"}</button></header>
    <main id="view"></main>
    <nav>${TABS.map(([k,i,l]) => `<button class="${S.tab===k?"on":""}" onclick="go('${k}')"><span class="i">${i}</span>${l}</button>`).join("")}</nav>`;
  views[S.tab]();
}
const go = t => { S.tab = t; S.sel = S.add = S.ed = null; S.gf = 0; render(); };
const fmt = n => new Intl.NumberFormat("he-IL", { style: "currency", currency: "ILS", maximumFractionDigits: 0 }).format(n || 0);
const today = () => new Date().toISOString().slice(0, 10);
const V = h => ($("#view").innerHTML = h);
const opt = (a, k, l) => (a || []).map(x => `<option value="${esc(x[k])}">${esc(x[l])}</option>`).join("");

async function loadAll() {
  if (S.mk === undefined) await loadMk();
  const [i, t, v] = await Promise.all([
    SB.from("investments").select("*,institutions(name),asset_types(name)").eq("archived", false).order("created_at"),
    SB.from("transactions").select("investment_id,kind,amount,occurred_on"),
    SB.from("valuations").select("investment_id,value,as_of,created_at,source_label").order("as_of", { ascending: false }).order("created_at", { ascending: false })]);
  const err = i.error || t.error || v.error; if (err) throw err;
  const dep = {}, val = {};
  t.data.forEach(x => dep[x.investment_id] = (dep[x.investment_id] || 0) + (x.kind === "deposit" ? 1 : -1) * Number(x.amount));
  v.data.forEach(x => { if (!(x.investment_id in val)) val[x.investment_id] = x; });
  return i.data.map(r => {
    const d = dep[r.id] || 0, l = val[r.id], aft = l ? t.data.filter(z => z.investment_id === r.id && z.occurred_on > l.as_of).reduce((a, z) => a + (z.kind === "deposit" ? 1 : -1) * Number(z.amount), 0) : 0;
    let v = l ? Number(l.value) + aft : d, est = false;
    if (l && r.valuation_mode === "index" && S.mk) { const f = idxAt(l.as_of); if (f) { v = Number(l.value) * (S.mk[S.mk.length - 1][1] / f) + aft; est = true;
      const fr = (r.fee_pct || 0) / 100; if (r.fee_basis === "profit") { const gn = v - (Number(l.value) + aft); if (gn > 0) v -= gn * fr; } else v *= 1 - fr * (Date.now() - new Date(l.as_of)) / 31557600000; } }
    return { ...r, dep: d, val: v, est, asOf: l && l.as_of, srcLabel: l && l.source_label, hasVal: !!l };
  });
}

async function members() {
  if (!S.mem) { const r = await SB.from("household_members").select("user_id,display_name"); S.mem = r.data || []; }
  return S.mem;
}
function donut(items) {
  const T = items.reduce((a, x) => a + x.v, 0), C = ["#4F46E5","#0D9488","#F59E0B","#EC4899","#8B5CF6","#22C55E","#06B6D4","#F97316"];
  let off = 25;
  const segs = items.map((x, i) => { const p = x.v / T * 100, s = `<circle cx="21" cy="21" r="15.915" fill="none" stroke="${C[i % 8]}" stroke-width="6" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${off}"/>`; off -= p; return s; }).join("");
  return `<div class="donutw"><svg viewBox="0 0 42 42" width="130" height="130">${segs}</svg><div class="leg">${items.map((x, i) => `<div><i style="background:${C[i % 8]}"></i>${esc(x.n)}<b>${Math.round(x.v / T * 100)}%</b></div>`).join("")}</div></div>`;
}
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function sheet(title, label, cb, def, dd, withSrc) {
  const d = document.createElement("div"); d.className = "ov";
  d.innerHTML = `<div class="sh"><h2>${esc(title)}</h2><label>${esc(label)}</label><input id="sv" inputmode="decimal" dir="ltr" placeholder="0"><label>תאריך</label><input id="sd" type="date" dir="ltr" value="${dd || today()}">${withSrc ? `<label>מקור הנתון</label><select id="ss"><option>דוח חודשי של בית ההשקעות</option><option>דוח רבעוני</option><option>דוח שנתי</option><option>אתר או אפליקציה של הגוף המנהל</option><option value="est">הערכה אישית</option></select>` : ""}<button id="ok">אישור</button><button class="ghost" id="no">ביטול</button></div>`;
  document.body.appendChild(d);
  const c = () => d.remove(); d.onclick = e => { if (e.target === d) c(); };
  $("#no").onclick = c;
  $("#ok").onclick = async () => { const a = parseFloat($("#sv").value.replace(/,/g, "")); if (isNaN(a) || a < 0) return; const dt = $("#sd").value || today(), so = $("#ss") ? $("#ss").selectedOptions[0] : null, sv = so ? { l: so.text, e: so.value === "est" } : null; c(); await cb(a, dt, sv); };
  if (def !== undefined) $("#sv").value = def; $("#sv").focus();
}

const views = {
  async home() {
    V(`<div class="hero"><div class="lbl">טוען…</div><div class="hbig">&nbsp;</div></div>`);
    try {
      const [L0, mem] = await Promise.all([loadAll(), members()]);
      if (!$("#view")) return;
      const f = S.f || "all";
      const L = L0.filter(x => f === "all" || (f === "joint" ? !x.owner_user_id : x.owner_user_id === f));
      const v = L.reduce((a, x) => a + x.val, 0), d = L.reduce((a, x) => a + x.dep, 0), p = v - d, pct = d > 0 ? p / d * 100 : 0;
      const g = {}; L.forEach(x => { const k = (x.asset_types && x.asset_types.name) || "ללא סוג"; g[k] = (g[k] || 0) + x.val; });
      const items = Object.entries(g).map(([n, v]) => ({ n, v })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
      const seg = [["all", "משפחה"], ...mem.map(m => [m.user_id, m.display_name]), ["joint", "משותף"]];
      V(`<div class="seg">${seg.map(([k, l]) => `<button class="${f === k ? "on" : ""}" onclick="S.f='${k}';render()">${esc(l)}</button>`).join("")}</div>
        <div class="hero"><div class="lbl">סך ההון</div><div class="hbig">${fmt(v)}</div>
          <div class="chip">${p >= 0 ? "▲" : "▼"} ${fmt(Math.abs(p))}${d > 0 ? ` · ${Math.abs(pct).toFixed(1)}%` : ""}</div>
          <div class="sm">לפי עדכוני שווי שהוזנו, לא שווי רשמי</div></div>
        <div class="row"><div class="card"><div class="muted">הפקדות נטו</div><div class="n">${fmt(d)}</div></div>
          <div class="card"><div class="muted">רווח / הפסד</div><div class="n" style="color:var(${p >= 0 ? "--accent" : "--bad"})">${fmt(p)}</div></div></div>
        ${items.length ? `<div class="card"><h2>חלוקה לפי סוג</h2>${donut(items)}</div>` : `<div class="card muted">עדיין אין השקעות. הוסיפו את הראשונה בלשונית "השקעות".</div>`}`);
      if (L.length) { $("#view").insertAdjacentHTML("beforeend", '<div class="card" id="hist"><div class="muted">טוען גרף…</div></div>'); S.L2 = L; S.R = await rawData(); drawHist();
        const DY = { monthly: 35, quarterly: 100, yearly: 380 }, st = L.filter(x => { const c = x.report_cadence || "monthly"; return c !== "none" && (!x.hasVal || Date.now() - new Date(x.asOf) > DY[c] * 864e5); });
        if (st.length) $("#view").insertAdjacentHTML("beforeend", `<div class="card"><h2>דוחות לעדכון</h2>${st.slice(0, 6).map(x => `<div style="padding:10px 0;border-top:1px solid var(--line);cursor:pointer" onclick="S.tab='inv';S.sel='${x.id}';render()"><b>${esc(x.name)}</b> <span class="muted">· ${x.hasVal ? "עודכן " + esc(x.asOf) : "ללא עדכון"}</span></div>`).join("")}</div>`);
        const fee = L.reduce((a, x) => a + annFee(x), 0);
        if (fee > 0) $("#view").insertAdjacentHTML("beforeend", `<div class="card"><div class="muted">דמי ניהול שנתיים משוערים</div><div class="n">${fmt(fee)}</div></div>`); }
    } catch (e) { V(`<div class="err">${esc(e.message)}</div>`); }
  },
  async inv() {
    if (S.sel) return detail(S.sel);
    if (S.add) return addForm();
    V(`<div id="ih" class="muted" style="padding:20px 0">טוען…</div>`);
    try { const [L, mm] = await Promise.all([loadAll(), SB.from("household_members").select("user_id,display_name")]); S.IL = L; S.mem = mm.data || []; if ($("#ih")) drawInv(); }
    catch (e) { $("#ih").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  },
  async goals() {
    if (S.gf) return goalForm();
    V(`<button onclick="S.gf=1;render()">מטרה חדשה</button><div id="gl" class="muted" style="margin-top:14px">טוען…</div>`);
    try {
      const [g, L] = await Promise.all([SB.from("goals").select("*,goal_investments(investment_id,share_pct)").order("target_date"), loadAll()]);
      if (g.error) throw g.error; if (!$("#gl")) return;
      const by = Object.fromEntries(L.map(x => [x.id, x]));
      $("#gl").innerHTML = g.data.length ? g.data.map(o => {
        const cur = o.goal_investments.reduce((a, l) => a + (by[l.investment_id] ? by[l.investment_id].val * l.share_pct / 100 : 0), 0), pc = Math.min(100, cur / o.target_amount * 100);
        const mo = o.target_date ? Math.max(1, Math.round((new Date(o.target_date) - new Date()) / 2629800000)) : 0;
        return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>${esc(o.name)}</h2><button class="ghost" style="width:auto;margin:0;padding:4px 10px" onclick="delGoal('${o.id}')">✕</button></div>
          <div class="muted">${fmt(cur)} מתוך ${fmt(o.target_amount)}${o.target_date ? " · עד " + esc(o.target_date) : ""}</div>

function series(L, R, g) {
  const ids = new Set(L.map(x => x.id)), t = R.t.filter(e => ids.has(e.investment_id)), v = R.v.filter(e => ids.has(e.investment_id));
  const ds = [...t.map(e => e.occurred_on), ...v.map(e => e.as_of)].sort(); if (!ds.length) return [];
  const iso = d => d.toISOString().slice(0, 10), st = new Date(ds[0]), now = new Date(), step = g === "y" ? 12 : g === "q" ? 3 : 1, ends = [];
  for (let d = new Date(Date.UTC(st.getUTCFullYear(), st.getUTCMonth() + 1, 0)); d <= now; d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 2, 0)))

      const vs = v.filter(r => r.investment_id === x.id && r.as_of <= e).sort((a, b) => b.as_of.localeCompare(a.as_of))[0];
      const aft = vs ? t.filter(r => r.investment_id === x.id && r.occurred_on > vs.as_of && r.occurred_on <= e).reduce((a, r) => a + (r.kind === "deposit" ? 1 : -1) * Number(r.amount), 0) : 0;
      td += dep; tv += vs ? Number(vs.value) + aft : dep;

  S.cp = p; S.cf = L;
  $("#cres").innerHTML = `<div class="card"><div class="muted">שווי סופי אחרי ${p.yrs} שנים</div><div class="big">${fmt(L.b)}</div>
    <div class="row" style="margin-top:12px"><div><div class="muted">הופקד בפועל</div><div class="n">${fmt(L.d)}</div></div><div><div class="muted">נוצר מתשואה</div><div class="n">${fmt(L.b - L.d)}</div></div></div>
    <div class="row" style="margin-top:12px"><div><div class="muted">שווי ריאלי (אחרי אינפלציה)</div><div class="n">${fmt(real)}</div></div><div><div class="muted">עלות דמי הניהול</div><div class="n">${fmt(r0[r0.length - 1].b - L.b)}</div></div></div>
    ${lines(r.map(x => x.b), r.map(x => x.d))}<div class="muted">קו מלא: שווי · מקווקו: הפקדות. תחזית תיאורטית, לא הבטחה.</div>
    <button class="ghost" onclick="saveSc()">שמירת התרחיש להשוואה</button></div>`;
}
function saveSc() { const p = S.cp, f = S.cf; S.sc = [...(S.sc || []), { mo: p.mo, rate: p.rate, yrs: p.yrs, b: f.b, d: f.d }].slice(-4); drawSc(); toast("נשמר להשוואה"); }
function drawSc() {
  const el = $("#csc"); if (!el || !(S.sc || []).length) return;
  el.innerHTML = `<div class="card"><h2>השוואת תרחישים</h2>${S.sc.map((s, i) => `<div style="display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)"><div><b>תרחיש ${i + 1}</b><div class="muted">${fmt(s.mo)}/חודש · ${s.rate}% · ${s.yrs} שנים</div></div><div style="text-align:end"><b>${fmt(s.b)}</b><div class="muted">רווח ${fmt(s.b - s.d)}</div></div></div>`).join("")}<button class="ghost" onclick="S.sc=[];render()">ניקוי</button></div>`;
}
/* ===== market ===== */
async function loadMk() { try { const r = await fetch("market.json?v=" + new Date().toISOString().slice(0, 13)); S.mkMeta = await r.json(); S.mk = S.mkMeta.series.SPX; } catch (e) { S.mk = null; } }
function idxAt(d) { let v = null; for (const p of S.mk) { if (p[0] <= d) v = p[1]; else break; } return v; }
function spark(a) {
  const W = 320, H = 90, P = 6, lo = Math.min(...a), hi = Math.max(...a), X = i => P + i * (W - 2 * P) / (a.length - 1), Y = v => H - P - (v - lo) / (hi - lo || 1) * (H - 2 * P);
  return `<svg viewBox="0 0 ${W} ${H}" dir="ltr" style="width:100%;display:block;margin:8px 0"><path d="${a.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1)).join("")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}
async function market(seg) {
  V(seg + `<div class="card"><h2>S&amp;P 500</h2><div id="ix" class="muted">טוען…</div></div><div class="card"><h2>שערי מטבע</h2><div id="fx" class="muted">טוען…</div></div>`);
  loadMk().then(() => {
    const a = S.mk, el = $("#ix"); if (!el) return;
    if (!a || a.length < 30) { el.textContent = "עדיין אין נתוני מדד. יש להפעיל את המשימה האוטומטית (Actions) ב-GitHub, לפי ההסבר."; return; }
    const n = a.length, last = a[n - 1][1], pc = (v, b) => b ? (v / b - 1) * 100 : null, yr = last_year => { let b = null; for (const p of a) { if (p[0] < last_year) b = p[1]; else break; } return b; };
    const y0 = new Date().getFullYear() + "-01-01", d1 = new Date(); d1.setFullYear(d1.getFullYear() - 1);
    const chip = (l, x) => `<div style="flex:1"><div class="muted">${l}</div><b style="color:var(${x != null && x < 0 ? "--bad" : "--accent"})">${x == null ? "—" : (x >= 0 ? "▲ " : "▼ ") + Math.abs(x).toFixed(2) + "%"}</b></div>`;
    el.innerHTML = `<div class="big" style="font-size:34px">${last.toLocaleString("he-IL", { maximumFractionDigits: 2 })}</div>
      <div style="display:flex;gap:10px;margin-top:8px">${chip("יומי", pc(last, a[n - 2][1]))}${chip("מתחילת השנה", pc(last, yr(y0)))}${chip("שנה", pc(last, yr(d1.toISOString().slice(0, 10))))}</div>
      ${spark(a.slice(-260).map(p => p[1]))}<div class="muted">סגירה אחרונה ${esc(a[n - 1][0])} · נתוני שוק ציבוריים, בעיכוב של עד יום מסחר.</div>`;
  });
  try {
    const q = async c => (await fetch(`https://api.frankfurter.dev/v2/providers/boi/rate/${c}/ils`)).json();
    const [u, e] = await Promise.all([q("usd"), q("eur")]); if (!$("#fx")) return;
    $("#fx").innerHTML = [["דולר", u], ["יורו", e]].map(([n, d]) => `<div style="display:flex;justify-content:space-between;padding:8px 0"><b>${n}</b><b>₪${Number(d.rate).toFixed(3)}</b></div>`).join("") + `<div class="muted">שער יציג של בנק ישראל, מתעדכן פעם ביום${u.date ? " · " + esc(u.date) : ""}.</div>`;
  } catch (x) { if ($("#fx")) $("#fx").textContent = "שערי המטבע לא זמינים כרגע."; }
}
function autoMode() { const m = $("#f_m"); if (m && !S.ed && m.value === "manual" && /s\s*&\s*p|sp\s*500|ס.?אנד|500/i.test($("#f_n").value + " " + $("#f_k").value)) m.value = "index"; }
/* ===== goals ===== */
async function goalForm() {
  V("טוען…"); const L = await loadAll();
  V(`<button class="ghost" onclick="S.gf=0;render()">→ ביטול</button><div class="card" style="margin-top:12px"><h2>מטרה חדשה</h2>
    <label>שם המטרה</label><input id="g_n"><label>סכום יעד (₪)</label><input id="g_a" inputmode="decimal" dir="ltr">
    <label>תאריך יעד</label><input id="g_d" type="date" dir="ltr"><label>טווח</label><select id="g_h"><option value="medium">בינוני</option><option value="long">ארוך</option><option value="short">קצר</option></select>
    <label>השקעות שמשויכות למטרה</label>${L.map(x => `<label style="display:flex;gap:8px;align-items:center;color:var(--text);padding:6px 0"><input type="checkbox" class="g_c" value="${x.id}" style="width:auto;margin:0"> ${esc(x.name)}</label>`).join("") || '<div class="muted">אין עדיין השקעות</div>'}
    <button onclick="saveGoal()" style="margin-top:12px">שמירה</button></div>`);
}
async function saveGoal() {
  const n = $("#g_n").value.trim(), a = parseFloat($("#g_a").value.replace(/,/g, "")); if (!n || !(a > 0)) return alert("יש להזין שם וסכום יעד");
  const r = await SB.from("goals").insert({ household_id: S.m.household_id, name: n, horizon: $("#g_h").value, target_amount: a, target_date: $("#g_d").value || null }).select("id").single();
  if (r.error) return alert(r.error.message);
  const ids = [...document.querySelectorAll(".g_c:checked")].map(e => e.value);
  if (ids.length) await SB.from("goal_investments").insert(ids.map(i => ({ goal_id: r.data.id, investment_id: i })));
  S.gf = 0; toast("נשמר ✓"); render();
}
async function delGoal(id) { if (!confirm("למחוק את המטרה?")) return; await SB.from("goals").delete().eq("id", id); render(); }
async function exportCsv() {
  const [L, R] = await Promise.all([loadAll(), rawData()]), nm = Object.fromEntries(L.map(x => [x.id, x.name])), q = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const rows = [["סוג רשומה", "השקעה", "תאריך", "סכום"], ...R.t.map(e => [e.kind === "deposit" ? "הפקדה" : "משיכה", nm[e.investment_id], e.occurred_on, e.amount]), ...R.v.map(e => ["עדכון שווי", nm[e.investment_id], e.as_of, e.value])];
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + rows.map(r => r.map(q).join(",")).join("\n")], { type: "text/csv" })); a.download = "wealth.csv"; a.click();
}

const HZ = { short: "טווח קצר", medium: "טווח בינוני", long: "טווח ארוך" }, PAL = ["#4F46E5", "#0D9488", "#F59E0B", "#EC4899", "#8B5CF6", "#22C55E", "#06B6D4", "#F97316"];
const annFee = x => { const f = (x.fee_pct || 0) / 100; return x.fee_basis === "profit" ? Math.max(0, x.val - x.dep) * f : x.val * f; };
const setIg = k => { S.ig = k; drawInv(); };
function drawInv() {
  const g = S.ig || "type", L = S.IL, nm = Object.fromEntries(S.mem.map(m => [m.user_id, m.display_name]));
  const key = x => g === "type" ? (x.asset_types && x.asset_types.name) || "ללא סוג" : g === "horizon" ? HZ[x.horizon] || "—" : (x.institutions && x.institutions.name) || "ללא בית השקעות";
  const G = {}; L.forEach(x => (G[key(x)] = G[key(x)] || []).push(x));
  const gr = Object.entries(G).map(([k, a]) => ({ k, a, v: a.reduce((s, x) => s + x.val, 0) })).sort((a, b) => b.v - a.v), tot = gr.reduce((s, x) => s + x.v, 0);
  const seg = `<div class="seg">${[["type", "לפי סוג"], ["horizon", "לפי ייעוד וטווח"], ["inst", "לפי בית השקעות"]].map(([k, l]) => `<button class="${g === k ? "on" : ""}" onclick="setIg('${k}')">${l}</button>`).join("")}</div>`;
  $("#ih").innerHTML = `<button onclick="S.add=1;render()">הוספת השקעה</button>${seg}` + (L.length ? `
    <div style="display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:6px 0 4px">${gr.map((x, i) => `<i style="flex:${Math.max(x.v, 0.01)};background:${PAL[i % 8]}"></i>`).join("")}</div>` +
    gr.map((x, i) => `<div style="margin:20px 0 8px;display:flex;align-items:center;gap:8px"><span style="width:10px;height:10px;border-radius:3px;background:${PAL[i % 8]}"></span><b style="flex:1">${esc(x.k)}</b><b>${fmt(x.v)}</b><span class="muted" style="min-width:38px;text-align:end">${tot ? (x.v / tot * 100).toFixed(0) : 0}%</span></div>` +
      x.a.map(y => { const p = y.val - y.dep; return `<div class="card" style="border-inline-start:4px solid ${PAL[i % 8]};cursor:pointer;padding:14px 16px;margin-bottom:8px" onclick="S.sel='${y.id}';render()"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${esc(y.name)}</b><div class="muted">${esc(g === "inst" ? (y.asset_types && y.asset_types.name) || "" : (y.institutions && y.institutions.name) || "")} · ${y.owner_user_id ? esc(nm[y.owner_user_id] || "") : "משותף"}${g === "horizon" ? "" : " · " + (HZ[y.horizon] || "")}${y.est ? " · הערכה" : ""}</div></div><div style="text-align:end"><b>${fmt(y.val)}</b><div class="muted" style="color:var(${p >= 0 ? "--accent" : "--bad"})">${p >= 0 ? "+" : "−"}${fmt(Math.abs(p))}</div></div></div></div>`; }).join("")).join("")
    : `<div class="muted" style="margin-top:16px">עדיין אין השקעות. הוסיפו את הראשונה.</div>`);
}

boot();
</script>
