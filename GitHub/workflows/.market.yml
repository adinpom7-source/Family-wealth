name: market
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch S&P 500
        run: |
          python3 - <<'PY'
          import csv, io, json, datetime, urllib.request
          def get(u):
              r = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
              return urllib.request.urlopen(r, timeout=30).read().decode()
          def stooq():
              rows = csv.DictReader(io.StringIO(get("https://stooq.com/q/d/l/?s=%5Espx&i=d")))
              return [[r["Date"], float(r["Close"])] for r in rows if r.get("Close")]
          def yahoo():
              d = json.loads(get("https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?range=10y&interval=1d"))["chart"]["result"][0]
              return [[datetime.datetime.utcfromtimestamp(t).strftime("%Y-%m-%d"), c] for t, c in zip(d["timestamp"], d["indicators"]["quote"][0]["close"]) if c]
          s = []
          for f in (stooq, yahoo):
              try:
                  s = f()
                  if len(s) > 100: break
              except Exception as e:
                  print(f.__name__, "failed:", e)
          if len(s) < 100: raise SystemExit("no data")
          json.dump({"updated": datetime.datetime.utcnow().isoformat() + "Z", "series": {"SPX": s[-3000:]}}, open("market.json", "w"))
          PY
      - name: Save
        run: |
          git config user.name market-bot
          git config user.email market-bot@users.noreply.github.com
          git add market.json
          git commit -m "update market data" || exit 0
          git push
